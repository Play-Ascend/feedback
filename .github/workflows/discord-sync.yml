name: Sync Discord, GitHub and Linear

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: List what would be filed without filing it
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

concurrency:
  group: discord-sync
  cancel-in-progress: false

jobs:
  sync:
    # GitHub-hosted jobs are refused while the org's Actions billing is blocked; Blacksmith runs them.
    # Same pattern as ascend-app (#1277): set vars.LINUX_RUNNER to move back without a code change.
    runs-on: ${{ vars.LINUX_RUNNER || 'blacksmith-2vcpu-ubuntu-2604' }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: node scripts/discord-to-github.mjs
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_GUILD_ID: ${{ vars.DISCORD_GUILD_ID }}
          DISCORD_FORUM_CHANNEL_ID: ${{ vars.DISCORD_FORUM_CHANNEL_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
      # GitHub's issue list lags a few seconds behind creation; without this the
      # issues filed in the step above wait a full cycle before reaching Linear.
      - run: sleep 15
      - run: node scripts/sync-followups-and-linear.mjs
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_FORUM_CHANNEL_ID: ${{ vars.DISCORD_FORUM_CHANNEL_ID }}
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          LINEAR_TEAM_ID: ${{ vars.LINEAR_TEAM_ID }}
          LINEAR_LABEL_ID: ${{ vars.LINEAR_LABEL_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
