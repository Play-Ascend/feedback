name: Tell Discord when an issue closes

on:
  issues:
    types: [closed, reopened]

permissions:
  contents: read

jobs:
  notify:
    if: contains(github.event.issue.labels.*.name, 'discord')
    # GitHub-hosted jobs are refused while the org's Actions billing is blocked; Blacksmith runs them.
    # Same pattern as ascend-app (#1277): set vars.LINUX_RUNNER to move back without a code change.
    runs-on: ${{ vars.LINUX_RUNNER || 'blacksmith-2vcpu-ubuntu-2604' }}
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: node scripts/notify-discord.mjs
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_FORUM_CHANNEL_ID: ${{ vars.DISCORD_FORUM_CHANNEL_ID }}
